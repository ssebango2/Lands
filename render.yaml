services:
  - type: web
    name: lands
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    branch: main
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # lib/socketServer.js uses this as the Socket.IO CORS origin in production,
      # so it must match the service's public URL.
      - key: NEXT_PUBLIC_APP_URL
        value: https://lands-4df1.onrender.com
